[project]
name = "impactrouter"
version = "0.1.0"
description = "A drop-in HTTP proxy that routes sibling LLM agent calls to the same backend instance to maximize prefix-cache reuse (RadixAttention / PagedAttention prefix cache)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "xxhash>=3.4",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impactrouter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
